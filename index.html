<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Tracker</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#f1fbea;--card:#fff;--tx:#1d2b1d;--mut:#6f8a6c;--pri:#3a9a5b;--on:#fff;--lav:#e2f6d3;--bd:#cfeab9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f140f;--card:#1a231a;--tx:#f2fff0;--mut:#9db79a;--pri:#9be28f;--on:#111;--lav:#243324;--bd:#2f4430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f140f;--card:#1a231a;--tx:#f2fff0;--mut:#9db79a;--pri:#9be28f;--on:#111;--lav:#243324;--bd:#2f4430;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 Nunito,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:.2em 0}h2{font-size:1.3rem;margin:1.2em 0 .5em}
.card{background:var(--card);border:2px solid var(--bd);border-radius:30px;padding:22px;margin:14px 0;box-shadow:0 6px 18px rgba(80,170,100,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-size:1.9rem;font-weight:700;color:var(--pri)}.mut{color:var(--mut);font-size:.9rem}
button,input,select{font:inherit;border-radius:20px;border:2px solid var(--bd);padding:14px;background:var(--card);color:var(--tx);width:100%}
button{background:var(--pri);color:var(--on);border:0;border-radius:999px;font-weight:800;cursor:pointer;width:auto;padding:14px 22px}
button.sec{background:var(--lav);color:var(--pri)}button.sm{padding:8px 14px;font-size:.9rem}button.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.sp{justify-content:space-between}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:999px;display:flex;padding:6px;z-index:5;box-shadow:0 8px 24px rgba(60,140,80,.22)}
nav button{flex:1;background:none;color:var(--mut);padding:8px 2px;font-size:.75rem;border-radius:999px}nav button.on{background:var(--pri);color:var(--on)}
.hero{background:linear-gradient(135deg,#c4efb0,#eafbd8);color:#1d2b1d;border-radius:40px;padding:34px 22px;margin:8px 0;text-align:center}.hero p{opacity:.85;margin:.3em 0 1em}
.hero button{background:#1d2b1d;color:#fff;margin:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kp button{background:var(--lav);color:var(--tx);font-size:1.5rem;padding:16px;border-radius:24px}
.amt{font-size:2.4rem;font-weight:700;text-align:center;color:var(--pri);padding:10px}
.seg{display:flex;gap:8px}.seg button{flex:1;background:var(--lav);color:var(--pri)}.seg button.on{background:var(--pri);color:var(--on)}
.bars{display:flex;align-items:flex-end;gap:8px;height:220px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--mut)}
.bar i{display:block;width:100%;background:linear-gradient(#bdeaa6,#4fb870);border-radius:999px;min-height:6px}
.prog{height:12px;background:var(--lav);border-radius:8px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#bdeaa6,#4fb870)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}.err{color:var(--pri);font-weight:600;min-height:1.4em}
.auth{max-width:440px;margin:0 auto}
</style></head><body><main id="app"></main><script>
const $=id=>document.getElementById(id);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ld=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let S={user:LS.get('mt_session'),tab:'home',mode:'in',err:'',f:null,emi:null,gp:'daily',gt:'spend'};
try{const t=LS.get('mt_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const blank=()=>({tx:[],cats:{spend:['Fuel','Food','Others'],save:['Next day savings','Others']},emis:[
 {id:'car',name:'Car EMI',total:0,monthly:0,n:0,paid:0,due:''},{id:'house',name:'House EMI',total:0,monthly:0,n:0,paid:0,due:''}]});
let D=null;
function load(){D=LS.get('mt_data_'+S.user)||blank()}
function save(){LS.set('mt_data_'+S.user,D)}
function toggleTheme(){const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark')||r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';LS.set('mt_theme',r.dataset.theme)}
async function auth(){
 const u=$('u').value.trim().toLowerCase(),p=$('p').value,users=LS.get('mt_users')||{};
 if(u.length<3||p.length<4){S.err='Username needs 3+ letters and password 4+ characters.';return go()}
 if(S.mode==='up'){if(users[u]){S.err='That username is taken.';return go()}
  const salt=crypto.randomUUID();users[u]={salt,hash:await sha(salt+p)};LS.set('mt_users',users)}
 else{const x=users[u];if(!x||x.hash!==await sha(x.salt+p)){S.err='Wrong username or password.';return go()}}
 S.user=u;S.err='';LS.set('mt_session',u);load();go()}
function logout(){S.user=null;LS.set('mt_session',null);go()}
function authView(){return `<div class="auth"><div class="hero"><h1>💰 Money Tracker</h1><p>Track what you spend and save, every day.</p></div>
<div class="card"><div class="seg"><button class="${S.mode==='in'?'on':''}" onclick="S.mode='in';S.err='';go()">Sign in</button><button class="${S.mode==='up'?'on':''}" onclick="S.mode='up';S.err='';go()">Create account</button></div>
<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
<p class="err">${esc(S.err)}</p><button class="full" onclick="auth()">${S.mode==='in'?'Sign in':'Create account'}</button>
<p class="mut">Accounts and data are stored only in this browser on this device. They are not synced online, and clearing browser data erases them.</p></div></div>`}
const mo=()=>ld().slice(0,7);
const sum=a=>a.reduce((s,t)=>s+t.amt,0);
const of=(type,fn=()=>true)=>D.tx.filter(t=>t.type===type&&fn(t));
function txRow(t){return `<div class="tx"><div><b>${esc(t.cat)}</b> <span class="mut">${t.date}${t.note?' · '+esc(t.note):''}</span></div><div class="row" style="flex:none;flex-wrap:nowrap"><b>${fmt(t.amt)}</b><button class="sec sm" onclick="editTx('${t.id}')">Edit</button><button class="sec sm" onclick="delTx('${t.id}')">Delete</button></div></div>`}
function home(){const m=of('spend',t=>t.date.startsWith(mo())),fuel=sum(m.filter(t=>t.cat==='Fuel')),food=sum(m.filter(t=>t.cat==='Food')),tot=sum(m),oth=tot-fuel-food;
 const rec=[...D.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
 return `<div class="hero"><h1>💸 Know where your money goes</h1><p>Hello, ${esc(S.user)}. Save a little every day and watch it grow.</p><button onclick="newTx('save')">＋ Quick save</button> <button onclick="newTx('spend')">＋ Add spending</button></div>
<h2>Spent this month · ${fmt(tot)}</h2><div class="grid"><div class="card"><div class="mut">💲 Fuel</div><div class="big">${fmt(fuel)}</div></div><div class="card"><div class="mut">💵 Food</div><div class="big">${fmt(food)}</div></div><div class="card"><div class="mut">📊 Others</div><div class="big">${fmt(oth)}</div></div></div>
<div class="card"><div class="mut">💵 Total saved</div><div class="big">${fmt(sum(of('save')))}</div></div>
<h2>Recent</h2><div class="card">${rec.length?rec.map(txRow).join(''):'<p class="mut">Nothing yet. Tap “Quick save” or “Add spending” to start.</p>'}</div>`}
function newTx(type){S.f={id:null,type,cat:D.cats[type][0],amt:'',date:ld(),note:''};S.tab='add';go()}
function editTx(id){const t=D.tx.find(x=>x.id===id);S.f={...t,amt:String(t.amt)};S.tab='add';go()}
function delTx(id){if(!confirm('Delete this entry?'))return;D.tx=D.tx.filter(t=>t.id!==id);save();go()}
function key(k){let a=S.f.amt;if(k==='<')a=a.slice(0,-1);else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}else if(a.length<10&&!/\.\d\d$/.test(a))a+=k;S.f.amt=a;$('amt').textContent='₹'+(a||'0')}
function setType(t){S.f.type=t;S.f.cat=D.cats[t][0];fld();go()}
function fld(){if($('cat')){S.f.cat=$('cat').value;S.f.date=$('dt').value;S.f.note=$('nt').value;S.f.newc=$('nc').value}}
function saveTx(){fld();const f=S.f,a=parseFloat(f.amt),nc=(f.newc||'').trim();
 if(!(a>0))return alert('Enter an amount above 0 using the keypad.');if(!f.date)return alert('Pick a date.');
 let cat=nc||f.cat;if(!D.cats[f.type].includes(cat))D.cats[f.type].push(cat);
 const r={id:f.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:f.type,cat,amt:a,date:f.date,note:f.note};
 if(f.id)D.tx=D.tx.map(t=>t.id===f.id?r:t);else D.tx.push(r);save();S.f=null;S.tab=f.type==='save'?'save':'home';go()}
function add(){if(!S.f)S.f={id:null,type:'spend',cat:D.cats.spend[0],amt:'',date:ld(),note:''};const f=S.f;
 return `<h1>${f.id?'Edit entry':'Add entry'}</h1><div class="card"><div class="seg"><button class="${f.type==='spend'?'on':''}" onclick="setType('spend')">Spending</button><button class="${f.type==='save'?'on':''}" onclick="setType('save')">Saving</button></div>
<div class="amt" id="amt">₹${esc(f.amt||'0')}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'.',0,'<'].map(k=>`<button onclick="key('${k}')">${k==='<'?'⌫':k}</button>`).join('')}</div>
<label>Category</label><select id="cat">${D.cats[f.type].map(c=>`<option ${c===f.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
<label>Or add a new category</label><input id="nc" placeholder="e.g. Gym" value="${esc(f.newc||'')}"><label>Date</label><input id="dt" type="date" value="${f.date}"><label>Note (optional)</label><input id="nt" value="${esc(f.note)}">
<p></p><button class="full" onclick="saveTx()">Save</button>${f.id?'<p></p><button class="sec full" onclick="S.f=null;S.tab=\'home\';go()">Cancel</button>':''}</div>`}
function savings(){const g=D.cats.save.map(c=>{const l=of('save',t=>t.cat===c).sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><div class="row sp"><b>${esc(c)}</b><span class="big">${fmt(sum(l))}</span></div>${l.map(txRow).join('')||'<p class="mut">No savings here yet.</p>'}<div class="row"><button class="sec sm" onclick="addTo('${esc(c).replace(/'/g,"\\'")}')">＋ Add money</button><button class="sec sm" onclick="renCat('${esc(c).replace(/'/g,"\\'")}')">Rename</button></div></div>`}).join('');
 return `<h1>Savings</h1><div class="card"><div class="mut">Total saved</div><div class="big">${fmt(sum(of('save')))}</div></div>${g}<div class="card"><label>New savings section</label><div class="row"><input id="ns" placeholder="e.g. Trip fund"><button onclick="addCat()">Add</button></div></div>`}
function addTo(c){S.f={id:null,type:'save',cat:c,amt:'',date:ld(),note:''};S.tab='add';go()}
function addCat(){const v=$('ns').value.trim();if(!v)return;if(!D.cats.save.includes(v))D.cats.save.push(v);save();go()}
function renCat(c){const v=(prompt('Rename section',c)||'').trim();if(!v||v===c||D.cats.save.includes(v))return;D.cats.save=D.cats.save.map(x=>x===c?v:x);D.tx.forEach(t=>{if(t.type==='save'&&t.cat===c)t.cat=v});save();go()}
function graph(){const now=new Date(),b=[];
 for(let i=(S.gp==='daily'?6:S.gp==='monthly'?5:4);i>=0;i--){let d=new Date(now),k,l;
  if(S.gp==='daily'){d.setDate(d.getDate()-i);k=ld(d);l=k.slice(8)+'/'+k.slice(5,7)}
  else if(S.gp==='monthly'){d=new Date(now.getFullYear(),now.getMonth()-i,1);k=ld(d).slice(0,7);l=d.toLocaleString('en',{month:'short'})}
  else{k=String(now.getFullYear()-i);l=k}
  b.push({k,l,v:sum(of(S.gt,t=>t.date.startsWith(k)))})}
 const mx=Math.max(...b.map(x=>x.v),1);
 return `<h1>Graph</h1><div class="card"><div class="seg"><button class="${S.gp==='daily'?'on':''}" onclick="S.gp='daily';go()">Daily</button><button class="${S.gp==='monthly'?'on':''}" onclick="S.gp='monthly';go()">Monthly</button><button class="${S.gp==='yearly'?'on':''}" onclick="S.gp='yearly';go()">Yearly</button></div><p></p>
<div class="seg"><button class="${S.gt==='spend'?'on':''}" onclick="S.gt='spend';go()">Spending</button><button class="${S.gt==='save'?'on':''}" onclick="S.gt='save';go()">Saving</button></div>
<div class="bars">${b.map(x=>`<div class="bar">${x.v?fmt(x.v):''}<i style="height:${x.v/mx*80}%"></i>${x.l}</div>`).join('')}</div></div>
${sum(D.tx)?'':'<p class="mut">No records yet, so the bars are empty. Add an entry to see them grow.</p>'}`}
function emiView(){const e=S.emi;
 if(e)return `<h1>${e.isNew?'Add EMI':'Edit EMI'}</h1><div class="card"><label>Name</label><input id="en" value="${esc(e.name)}"><label>Total loan amount (₹)</label><input id="et" type="number" inputmode="decimal" value="${e.total||''}"><label>Monthly instalment (₹)</label><input id="em" type="number" inputmode="decimal" value="${e.monthly||''}"><label>Total instalments</label><input id="enn" type="number" inputmode="numeric" value="${e.n||''}"><label>Instalments already paid</label><input id="ep" type="number" inputmode="numeric" value="${e.paid||0}"><label>Next due date</label><input id="ed" type="date" value="${e.due}"><p></p><button class="full" onclick="saveEmi()">Save EMI</button><p></p><button class="sec full" onclick="S.emi=null;go()">Cancel</button></div>`;
 const t=ld();
 return `<h1>EMIs</h1><div class="card"><div class="mut">Monthly EMI commitment</div><div class="big">${fmt(D.emis.filter(x=>x.paid<x.n).reduce((s,x)=>s+x.monthly,0))}</div></div>`+D.emis.map(x=>{
  const left=Math.max(x.n-x.paid,0),out=Math.max(x.total-x.paid*x.monthly,0),done=x.n>0&&left===0,over=!done&&x.due&&x.due<t,pc=x.n?Math.min(100,x.paid/x.n*100):0;
  return `<div class="card"><div class="row sp"><b style="font-size:1.2rem">${esc(x.name)}</b><span class="mut">${done?'✔ Completed':over?'Overdue':x.n?'Active':'Not set up'}</span></div>
<div class="prog"><i style="width:${pc}%"></i></div><p>Instalment <b>${fmt(x.monthly)}</b> · Paid <b>${x.paid}/${x.n}</b> · Left <b>${left}</b><br>Total <b>${fmt(x.total)}</b> · Outstanding <b>${fmt(out)}</b><br>Next due <b>${x.due||'—'}</b></p>
<div class="row"><button class="sm" onclick="pay('${x.id}',1)" ${done||!x.n?'disabled':''}>Mark paid</button><button class="sec sm" onclick="pay('${x.id}',-1)" ${x.paid?'':'disabled'}>Undo</button><button class="sec sm" onclick="editEmi('${x.id}')">Edit</button><button class="sec sm" onclick="delEmi('${x.id}')">Delete</button></div></div>`}).join('')+
 `<button class="full" onclick="S.emi={isNew:1,name:'',total:0,monthly:0,n:0,paid:0,due:''};go()">＋ Add another EMI</button><p class="mut">Outstanding = total − (paid × monthly). If your loan has interest or fees, enter the total you owe to the lender.</p>`}
function pay(id,d){const x=D.emis.find(e=>e.id===id);x.paid=Math.min(Math.max(x.paid+d,0),x.n);
 if(x.due){const dt=new Date(x.due+'T00:00');dt.setMonth(dt.getMonth()+d);x.due=ld(dt)}save();go()}
function editEmi(id){S.emi={...D.emis.find(e=>e.id===id)};go()}
function delEmi(id){if(!confirm('Delete this EMI?'))return;D.emis=D.emis.filter(e=>e.id!==id);save();go()}
function saveEmi(){const e=S.emi,n=Math.max(0,parseInt($('enn').value)||0),p=Math.max(0,parseInt($('ep').value)||0);
 const r={id:e.isNew?Date.now().toString(36):e.id,name:$('en').value.trim()||'EMI',total:Math.max(0,+$('et').value||0),monthly:Math.max(0,+$('em').value||0),n,paid:Math.min(p,n),due:$('ed').value};
 if(e.isNew)D.emis.push(r);else D.emis=D.emis.map(x=>x.id===r.id?r:x);S.emi=null;save();go()}
function setTab(t){if(t==='add')S.f=null;S.tab=t;S.emi=null;go()}
function go(){const a=$('app');
 if(!S.user){a.innerHTML=authView();return}if(!D)load();
 const tabs=[['home','💰','Home'],['add','💸','Add'],['save','💵','Savings'],['graph','📊','Graph'],['emi','💲','EMI']];
 const body={home,add,save:savings,graph,emi:emiView}[S.tab]();
 a.innerHTML=`<div class="row sp" style="flex-wrap:nowrap"><b style="color:var(--pri);font-size:1.25rem">💰 Money Tracker</b><span class="row" style="flex:none"><button class="sec sm" onclick="toggleTheme()">Theme</button><button class="sec sm" onclick="logout()">Log out</button></span></div>${body}<nav>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join('')}</nav>`}
go();
</script></body></html>
